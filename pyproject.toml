# uv workspace root for all Python code in this replication package.
# This directory is not a package itself; it only anchors the workspace so
# that every member below shares ONE resolution, ONE uv.lock, and ONE .venv.
# See the "Python environment" section of the top-level README.

[tool.uv.workspace]
members = [
    "benchmark/analysis",
    "benchmark/walk/build-times",
    "results/bench",
    "results/longitudinal/walk/notebooks",
    "results/exclusions",
    "libraries-dataset/1_libs_selection",
    "libraries-dataset/2_libs_download",
    "libraries-dataset/3_jdk_download",
]

# Shared notebook tooling: one Jupyter install for the whole workspace.
[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "pandas-stubs~=2.2.3",
]

[tool.ruff]
target-version = "py313"
